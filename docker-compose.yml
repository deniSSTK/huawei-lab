name: university-network

services:
  gateway:
    build: ./gateway
    volumes:
      - ./gateway/nftables.conf:/etc/nftables.conf:ro
      - ./gateway/nat.conf:/etc/nat.conf:ro
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    healthcheck:
      test: ["CMD-SHELL", "test $$(cat /proc/sys/net/ipv4/ip_forward) = 1 && nft list chain inet lab_filter forward >/dev/null && nft list chain ip lab_nat postrouting >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      guest:
        ipv4_address: 172.28.10.254
      corporate:
        ipv4_address: 172.28.20.254
      iot:
        ipv4_address: 172.28.30.254
      uplink:
        ipv4_address: 172.28.40.254
        gw_priority: 1

  guest-client:
    build: ./client
    depends_on:
      gateway:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        ip route replace default via 172.28.10.254
        exec sleep infinity
    cap_add:
      - NET_ADMIN
    networks:
      guest:
        ipv4_address: 172.28.10.10

  internal-site:
    image: nginx:stable-alpine
    depends_on:
      gateway:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        ip route replace default via 172.28.20.254
        exec nginx -g 'daemon off;'
    cap_add:
      - NET_ADMIN
    networks:
      corporate:
        ipv4_address: 172.28.20.10

  iot-client:
    image: alpine:3.22
    depends_on:
      gateway:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        ip route replace default via 172.28.30.254
        exec sleep infinity
    cap_add:
      - NET_ADMIN
    networks:
      iot:
        ipv4_address: 172.28.30.10

networks:
  guest:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
          gateway: 172.28.10.1

  corporate:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.20.0/24
          gateway: 172.28.20.1

  iot:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.30.0/24
          gateway: 172.28.30.1

  uplink:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.40.0/24
          gateway: 172.28.40.1
