events {}
http {
    access_log off;
    server {
        listen 80;
        location / { default_type text/plain; return 200 'STUDENT learning materials\n'; }
    }
    server {
        listen 8081;
        location / { default_type text/plain; return 200 'TEACHER service\n'; }
    }
    server {
        listen 8082;
        location / { default_type text/plain; return 200 'ADMIN service\n'; }
    }
}
