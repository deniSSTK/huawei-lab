# The entrypoint supplies uplink_if and loads this with nat.conf atomically.
# Reload only the lab's table; flushing avoids duplicate rules on restart.
add table inet lab_filter
flush table inet lab_filter

table inet lab_filter {
    counter guest_to_corporate {}
    counter iot_to_corporate {}
    counter guest_to_internet {}
    counter guest_dns {}
    counter default_deny {}

    chain forward {
        type filter hook forward priority filter; policy drop;

        # These restrictions also apply to previously established connections.
        ip saddr 172.28.10.0/24 ip daddr 172.28.20.0/24 counter name guest_to_corporate drop
        ip saddr 172.28.30.0/24 ip daddr 172.28.20.0/24 counter name iot_to_corporate drop

        ct state invalid drop

        # Only Guest may initiate web/DNS traffic through the external uplink.
        # Count web packets before established/related so checks also work
        # when a remote endpoint reuses an existing connection.
        ip saddr 172.28.10.0/24 oifname $uplink_if tcp dport { 80, 443 } counter name guest_to_internet accept
        ip saddr 172.28.10.0/24 oifname $uplink_if udp dport 53 counter name guest_dns accept
        ip saddr 172.28.10.0/24 oifname $uplink_if tcp dport 53 counter name guest_dns accept
        ct state established,related accept

        # Other new traffic, including IoT internet, remains blocked.
        counter name default_deny drop
    }
}
